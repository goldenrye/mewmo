# Mewmo's own HTTPS edge, for hosts where another service owns 80/443.
# Runs in a container on Mewmo's "app" network. See deploy/compose.edge.yaml.

# Refuse TLS for any other name, such as scanners connecting by IP address.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name mewmo.rental-mgmt.us;
    ssl_certificate /etc/letsencrypt/live/mewmo.rental-mgmt.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mewmo.rental-mgmt.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 12m;

    # Resolve at request time so recreating the web container cannot leave a
    # stale IP behind. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=30s;

    location / {
        set $mewmo_web http://web:80;
        proxy_pass $mewmo_web;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Uploaded bills must not be spooled to disk by the edge.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
