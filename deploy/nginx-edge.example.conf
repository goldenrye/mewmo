# Example for a HOST-level HTTPS edge. Do not install into rental-mgmt's
# containers or attach Mewmo to its Docker networks.
server {
    listen 443 ssl;
    server_name mewmo.example.com;
    ssl_certificate /etc/letsencrypt/live/mewmo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mewmo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
